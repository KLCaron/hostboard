name: hostboard
services:
  hostboard:
    image: hostboard:${HOSTBOARD_TAG:-local}
    build:
      context: .
    restart: unless-stopped
    # Linux host networking lets the backend reach the private loopback Agent.
    # HTTP binds to HOSTBOARD_BIND and IPv4 loopback, never all interfaces.
    network_mode: host
    environment:
      HOSTBOARD_BIND: ${HOSTBOARD_BIND:-127.0.0.1}
      PORT: ${HOSTBOARD_PORT:-8088}
      HOSTBOARD_CONFIG: /app/config/hosts.json
      HOSTBOARD_CHECKS: /app/config/checks.json
      HOSTBOARD_DB: /app/data/monitor.sqlite
      HOSTBOARD_ADMIN_CONFIG: /app/private/admin.json
      HOSTBOARD_SMTP_CONFIG: /app/private/smtp.json
      HOSTBOARD_PUBLIC_URL: ${HOSTBOARD_PUBLIC_URL:-}
    volumes:
      - ./config/hosts.json:/app/config/hosts.json:ro
      - ./config/checks.json:/app/config/checks.json:ro
      - ${HOSTBOARD_PRIVATE_DIR:-./private}:/app/private:ro
      - ${HOSTBOARD_DATA_DIR:-./data}:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
