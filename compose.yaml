name: hostboard
services:
  hostboard:
    image: ${HOSTBOARD_IMAGE:-ghcr.io/klcaron/hostboard:0.6.1}
    user: "${HOSTBOARD_UID:-1000}:${HOSTBOARD_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${HOSTBOARD_BIND:-127.0.0.1}:${HOSTBOARD_PORT:-8088}:8088"
    environment:
      HOSTBOARD_CONTAINER: '1'
      HOSTBOARD_BIND: 0.0.0.0
      PORT: '8088'
      HOSTBOARD_CONFIG: /app/config/hosts.json
      HOSTBOARD_CHECKS: /app/config/checks.json
      HOSTBOARD_DB: /app/data/monitor.sqlite
      HOSTBOARD_ADMIN_CONFIG: /app/private/admin.json
      HOSTBOARD_SMTP_CONFIG: /app/private/smtp.json
      HOSTBOARD_PUBLIC_URL: ${HOSTBOARD_PUBLIC_URL:-http://localhost:8088}
    volumes:
      - ./config:/app/config:ro
      - ${HOSTBOARD_PRIVATE_DIR:-./private}:/app/private:ro
      - ${HOSTBOARD_DATA_DIR:-./data}:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
